<text class="t" x="202.4" y="76">now: age τ, not finished</text>
<text class="ts" x="40" y="258">run time T (log axis); density of ln T; shaded: P(T &gt; τ) = S(τ)</text>
<text class="ts" x="40" y="274">mean residual life m(τ) = E[T − τ | T &gt; τ]</text>
<text class="tb" x="420" y="34">2. Wait, or restart?</text>
<rect class="boxk" x="420" y="128" width="128" height="44" rx="4"/>
<text class="t" x="484" y="147" text-anchor="middle">run stalled</text>
<text class="t" x="484" y="163" text-anchor="middle">at age τ</text>
<path class="edk" d="M548 142C580 142 560 92 596 92" marker-end="url(#arr)"/>
<path class="edk" d="M548 158C580 158 560 208 596 208" marker-end="url(#arr)"/>
<text class="t" x="544" y="120" text-anchor="end">wait</text>
<text class="t" x="544" y="192" text-anchor="end">restart</text>
<rect class="box" x="600" y="70" width="140" height="44" rx="4"/>
<text class="t" x="670" y="89" text-anchor="middle">expected to go:</text>
<text class="t" x="670" y="105" text-anchor="middle">m(τ)</text>
<rect class="box" x="600" y="186" width="140" height="44" rx="4"/>
<text class="t" x="670" y="205" text-anchor="middle">relaunch cost c,</text>
<text class="t" x="670" y="221" text-anchor="middle">then a fresh run: E[T]</text>
<rect class="boxk" x="420" y="262" width="320" height="64" rx="4"/>
<text class="tb" x="580" y="285" text-anchor="middle">restart iff  m(τ) &gt; E[T] + c</text>
<text class="ts" x="580" y="303" text-anchor="middle">the same inequality decides whether always restarting</text>
<text class="ts" x="580" y="317" text-anchor="middle">at cutoff τ beats never restarting</text>
<text class="ts" x="40" y="350">Classical baseline for a known run-time law and independent restarts; drawn for a lognormal with σ = 1.5, τ = 2.</text>

</svg>
