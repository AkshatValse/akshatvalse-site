<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Diagram: a run that has been going for time tau without finishing. Left, the run-time density with the region beyond tau shaded. Right, the choice between waiting, expected to take the mean residual life m(tau), and restarting, which costs c plus a fresh run; restart if and only if m(tau) exceeds E[T] + c.">
<title>Diagram: a run that has been going for time tau without finishing. Left, the run-time density with the region beyond tau shaded. Right, the choice between waiting, expected to take the mean residual life m(tau), and restarting, which costs c plus a fresh run; restart if and only if m(tau) exceeds E[T] + c.</title>
<desc>Mechanism diagram for the classical restart question. Not project data.</desc>
