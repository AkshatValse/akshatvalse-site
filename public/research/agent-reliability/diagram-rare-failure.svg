<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Diagram: an agent run as a chain of model and tool calls, each with a rare chance of failure; N simulated runs all finish, so the crude estimate is zero and supports only p below about 3 over N.">
<title>Diagram: an agent run as a chain of model and tool calls, each with a rare chance of failure; N simulated runs all finish, so the crude estimate is zero and supports only p below about 3 over N.</title>
<desc>Mechanism diagram for the rare-failure estimation problem. Not project data; symbols only.</desc>
<style>
.g{stroke:var(--rule,#e2e5e7);stroke-width:1;fill:none}
.a{stroke:var(--ink-2,#6a6e72);stroke-width:1;fill:none}
.l{fill:var(--ink-2,#6a6e72);font:11px var(--font-mono,ui-monospace,monospace)}
.t{fill:var(--ink,#2f3133);font:12px var(--font-sans,system-ui,sans-serif)}
.tb{fill:var(--ink,#2f3133);font:600 12.5px var(--font-sans,system-ui,sans-serif)}
.ts{fill:var(--ink-2,#6a6e72);font:11px var(--font-sans,system-ui,sans-serif)}
.rf{stroke:var(--ink,#2f3133);stroke-width:1;stroke-dasharray:6 4;fill:none}
.rd{stroke:var(--ink-2,#6a6e72);stroke-width:1;stroke-dasharray:2 3;fill:none}
.box{fill:var(--ground,#ffffff);stroke:var(--ink-2,#6a6e72);stroke-width:1}
.boxk{fill:var(--panel,#f5f6f6);stroke:var(--ink,#2f3133);stroke-width:1.25}
.ed{stroke:var(--ink-2,#6a6e72);stroke-width:1.25;fill:none}
.edk{stroke:var(--ink,#2f3133);stroke-width:1.5;fill:none}
.ah{fill:var(--ink-2,#6a6e72)}
.ahk{fill:var(--ink,#2f3133)}
.sh{fill:#888578;fill-opacity:0.16;stroke:none}
.mk{stroke:var(--ground,#ffffff);stroke-width:1.25}
.s0{stroke:#00224e;fill:none;stroke-width:1.75}.p0{fill:#00224e}.s1{stroke:#243d6e;fill:none;stroke-width:1.75}.p1{fill:#243d6e}.s2{stroke:#50586d;fill:none;stroke-width:1.75}.p2{fill:#50586d}.s3{stroke:#727274;fill:none;stroke-width:1.75}.p3{fill:#727274}.s4{stroke:#948e78;fill:none;stroke-width:1.75}.p4{fill:#948e78}
@media (prefers-color-scheme: dark){.s0{stroke:#676971}.p0{fill:#676971}.s1{stroke:#888578}.p1{fill:#888578}.s2{stroke:#aea272}.p2{fill:#aea272}.s3{stroke:#d6c25e}.p3{fill:#d6c25e}.s4{stroke:#fee838}.p4{fill:#fee838}.sh{fill:#bbad6d;fill-opacity:0.18}}
</style>
<defs><marker id="rarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="tb" x="30" y="34">1. One agent run: a loop of model and tool calls that can, rarely, end in failure</text>
<rect class="box" x="30" y="60" width="92" height="34" rx="4"/>
<text class="t" x="76" y="81" text-anchor="middle">model call</text>
<path class="ed" d="M124 77L146 77" marker-end="url(#rarr)"/>
<path class="ed" d="M76 96L76 118" stroke-dasharray="3 3" marker-end="url(#rarr)"/>
<rect class="box" x="148" y="60" width="92" height="34" rx="4"/>
<text class="t" x="194" y="81" text-anchor="middle">tool call</text>
<path class="ed" d="M242 77L264 77" marker-end="url(#rarr)"/>
<path class="ed" d="M194 96L194 118" stroke-dasharray="3 3" marker-end="url(#rarr)"/>
<rect class="box" x="266" y="60" width="92" height="34" rx="4"/>
<text class="t" x="312" y="81" text-anchor="middle">model call</text>
<path class="ed" d="M360 77L382 77" marker-end="url(#rarr)"/>
<path class="ed" d="M312 96L312 118" stroke-dasharray="3 3" marker-end="url(#rarr)"/>
<rect class="box" x="384" y="60" width="92" height="34" rx="4"/>
<text class="t" x="430" y="81" text-anchor="middle">tool call</text>
<path class="ed" d="M478 77L500 77" marker-end="url(#rarr)"/>
<path class="ed" d="M430 96L430 118" stroke-dasharray="3 3" marker-end="url(#rarr)"/>
<text class="t" x="548" y="81" text-anchor="middle">…</text>
<path class="ed" d="M596 77L618 77" marker-end="url(#rarr)"/>
<rect class="boxk" x="620" y="60" width="92" height="34" rx="4"/>
<text class="t" x="666" y="81" text-anchor="middle">done</text>
<line class="rd" x1="30" y1="126" x2="476" y2="126"/>
<text class="ts" x="253" y="142" text-anchor="middle">failure, probability p per run, too small to see</text>
<text class="tb" x="30" y="166">2. Direct simulation: N independent runs</text>
<line class="a" x1="30" y1="180" x2="340" y2="180"/><line class="a" x1="30" y1="185" x2="303" y2="185"/><line class="a" x1="30" y1="190" x2="326" y2="190"/><line class="a" x1="30" y1="195" x2="289" y2="195"/><line class="a" x1="30" y1="200" x2="312" y2="200"/><line class="a" x1="30" y1="205" x2="335" y2="205"/><line class="a" x1="30" y1="210" x2="298" y2="210"/><line class="a" x1="30" y1="215" x2="321" y2="215"/><line class="a" x1="30" y1="220" x2="284" y2="220"/><line class="a" x1="30" y1="225" x2="307" y2="225"/><line class="a" x1="30" y1="230" x2="330" y2="230"/><line class="a" x1="30" y1="235" x2="293" y2="235"/><line class="a" x1="30" y1="240" x2="316" y2="240"/><line class="a" x1="30" y1="245" x2="339" y2="245"/><line class="a" x1="30" y1="250" x2="302" y2="250"/><line class="a" x1="30" y1="255" x2="325" y2="255"/><line class="a" x1="30" y1="260" x2="288" y2="260"/><line class="a" x1="30" y1="265" x2="311" y2="265"/><line class="a" x1="30" y1="270" x2="334" y2="270"/><line class="a" x1="30" y1="275" x2="297" y2="275"/><line class="a" x1="30" y1="280" x2="320" y2="280"/><line class="a" x1="30" y1="285" x2="283" y2="285"/><line class="a" x1="30" y1="290" x2="306" y2="290"/><line class="a" x1="30" y1="295" x2="329" y2="295"/>
<text class="ts" x="350" y="236">every run</text>
<text class="ts" x="350" y="250">ends in done</text>
<rect class="boxk" x="470" y="160" width="262" height="150" rx="4"/>
<text class="tb" x="484" y="184">0 failures in N runs</text>
<text class="t" x="484" y="208">estimate of p: 0 / N = 0</text>
<text class="t" x="484" y="232">chance of this: (1 − p)^N ≈ e^(−Np)</text>
<text class="t" x="484" y="256">all it supports (95%):</text>
<text class="t" x="484" y="274">p &lt; 1 − 0.05^(1/N) ≈ 3/N</text>
<text class="ts" x="484" y="298">relative s.e.: √((1 − p)/(Np)), ≫ 1 when Np ≪ 1</text>
<text class="ts" x="30" y="343">The problem only; this project's approach is held back.</text>

</svg>
