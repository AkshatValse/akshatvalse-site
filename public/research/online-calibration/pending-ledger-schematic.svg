<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" width="640" height="352" role="img" aria-label="Schematic ledger of forecasts at one moment. Each row is one forecast's horizon. Forecasts whose horizon has ended are resolved as covered or missed. Of those still in flight, some have already crossed their bound, so their miss is certain, and the rest are pending. The eventual miss count lies between 6 and 8.">
<!-- Schematic, not project data. Generated by gh/briefs/assets-src/online-calibration-schematics.mjs (view: ledger).
     Toy: H=6; forecasts issued at t=1..11; now = end of step 12; increments Z^2, multiplied by 3 after step 6;
     every bound fixed at u = upper 0.1 quantile of chi2_6 = 10.644641; seed 105 (first seed giving a legible mix, searched from 1).
     Counts at now: delayed-only D=3, lower L=6, upper U=8; eventual misses M=7. -->
<style>
.ax{stroke:var(--ink-2,#6a6e72);stroke-width:1;fill:none}
.gr{stroke:var(--rule,#e2e5e7);stroke-width:1;fill:none}
.bd{stroke:var(--ink,#2f3133);stroke-width:1.5;stroke-dasharray:7 5;fill:none}
.pm{stroke:var(--ink,#2f3133);stroke-width:2.25;fill:none;stroke-linejoin:round}
.pm2{stroke:var(--ink,#2f3133);stroke-width:2.25;fill:none;stroke-linejoin:round;opacity:.35}
.pc{stroke:var(--ink-2,#6a6e72);stroke-width:2.25;fill:none;stroke-linejoin:round}
.acc{fill:#00224e}.accs{stroke:#00224e}
.accband{fill:#00224e;opacity:.08}
.dot{fill:var(--ground,#ffffff);stroke:var(--ink-2,#6a6e72);stroke-width:2}
.t{fill:var(--ink,#2f3133);font:500 13px var(--font-sans,'Helvetica Neue',Arial,sans-serif)}
.ts{fill:var(--ink-2,#6a6e72);font:400 12px var(--font-sans,'Helvetica Neue',Arial,sans-serif)}
.tsi{fill:var(--ink-2,#6a6e72);font:italic 400 12px var(--font-serif,Georgia,serif)}
.ti{fill:var(--ink,#2f3133);font:italic 400 14px var(--font-serif,Georgia,serif)}
.hit{fill:none;stroke:var(--ink-3,#9a9ea2);stroke-width:1.5}
.miss{fill:var(--ink,#2f3133);stroke:none}
.pend{fill:none;stroke:var(--ink-2,#6a6e72);stroke-width:1.5;stroke-dasharray:4 3}
.fut{fill:var(--field,#eef0f1);stroke:none}
.now{stroke:var(--ink,#2f3133);stroke-width:1.25;fill:none}
.bg{fill:var(--ground,#ffffff)}
.xm{stroke:var(--ground,#ffffff);stroke-width:2;fill:none}
@media (prefers-color-scheme: dark){
.ax,.pc{stroke:var(--ink-2,#a1a7ab)}
.gr{stroke:var(--rule,#2a3135)}
.bd,.pm,.pm2,.now{stroke:var(--ink,#ebe8e3)}
.acc{fill:#fee838}.accs{stroke:#fee838}
.accband{fill:#fee838;opacity:.06}
.dot{fill:var(--ground,#141719);stroke:var(--ink-2,#a1a7ab)}
.t,.ti{fill:var(--ink,#ebe8e3)}
.ts,.tsi{fill:var(--ink-2,#a1a7ab)}
.hit{stroke:var(--ink-3,#6f777c)}
.miss{fill:var(--ink,#ebe8e3)}
.pend{stroke:var(--ink-2,#a1a7ab)}
.fut{fill:var(--field,#1f2427)}
.xm{stroke:var(--ground,#141719)}
.bg{fill:var(--ground,#141719)}
}
</style>
<rect class="bg" x="0" y="0" width="640" height="352"/>
<text class="ts" x="46" y="32" text-anchor="end">issued</text>
<rect class="hit" x="56" y="50" width="126" height="14" rx="3"/><text class="ts" x="46" y="61" text-anchor="end">1</text><rect class="hit" x="77" y="72" width="126" height="14" rx="3"/><text class="ts" x="46" y="83" text-anchor="end">2</text><rect class="hit" x="98" y="94" width="126" height="14" rx="3"/><text class="ts" x="46" y="105" text-anchor="end">3</text><rect class="miss" x="119" y="116" width="126" height="14" rx="3"/><text class="ts" x="46" y="127" text-anchor="end">4</text><rect class="miss" x="140" y="138" width="126" height="14" rx="3"/><text class="ts" x="46" y="149" text-anchor="end">5</text><rect class="miss" x="161" y="160" width="126" height="14" rx="3"/><text class="ts" x="46" y="171" text-anchor="end">6</text><rect class="fut" x="287" y="182" width="21" height="14" rx="3"/><rect class="acc" x="182" y="182" width="105" height="14" rx="3"/><path class="xm" d="M241.5,184 L248.5,194 M248.5,184 L241.5,194"/><text class="ts" x="46" y="193" text-anchor="end">7</text><rect class="fut" x="287" y="204" width="42" height="14" rx="3"/><rect class="acc" x="203" y="204" width="84" height="14" rx="3"/><path class="xm" d="M241.5,206 L248.5,216 M248.5,206 L241.5,216"/><text class="ts" x="46" y="215" text-anchor="end">8</text><rect class="fut" x="287" y="226" width="63" height="14" rx="3"/><rect class="acc" x="224" y="226" width="63" height="14" rx="3"/><path class="xm" d="M241.5,228 L248.5,238 M248.5,228 L241.5,238"/><text class="ts" x="46" y="237" text-anchor="end">9</text><rect class="fut" x="287" y="248" width="84" height="14" rx="3"/><rect class="pend" x="245" y="248" width="42" height="14" rx="3"/><text class="ts" x="46" y="259" text-anchor="end">10</text><rect class="fut" x="287" y="270" width="105" height="14" rx="3"/><rect class="pend" x="266" y="270" width="21" height="14" rx="3"/><text class="ts" x="46" y="281" text-anchor="end">11</text>
<line class="ax" x1="56" y1="296" x2="392" y2="296"/>
<text class="ts" x="224" y="318" text-anchor="middle">time</text>
<line class="now" x1="287" y1="20" x2="287" y2="300"/>
<text class="t" x="287" y="16" text-anchor="middle">now</text>
<rect class="hit" x="420" y="52" width="22" height="12" rx="3"/><text class="ts" x="450" y="62">resolved, covered</text>
<rect class="miss" x="420" y="76" width="22" height="12" rx="3"/><text class="ts" x="450" y="86">resolved, missed</text>
<rect class="acc" x="420" y="100" width="22" height="12" rx="3"/><text class="ts" x="450" y="110">in flight, miss already certain</text>
<rect class="pend" x="420" y="124" width="22" height="12" rx="3"/><text class="ts" x="450" y="134">in flight, pending</text>
<text class="ts" x="420" y="170"><tspan font-weight="500">×</tspan>  step the bound was crossed</text>
<line class="gr" x1="420" y1="186" x2="624" y2="186"/>
<text class="t" x="420" y="210">eventual misses among these 11</text>
<text class="t" x="420" y="232">lie in [ 6 , 8 ]</text>
<text class="ts" x="420" y="256">scoring only at each horizon’s end</text>
<text class="ts" x="420" y="274">would count 3 so far</text>
