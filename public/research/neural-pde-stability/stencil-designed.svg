<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Schematic of three finite-volume cells j-1, j, j+1 with cell averages drawn as bars. At the faces x_{j-1/2} and x_{j+1/2} the designed upwind flux a times the upwind cell average is evaluated. Each face value is subtracted from the cell on one side and added to the cell on the other, so the sum of cell averages telescopes. Heights are illustrative, not data.">
<style>
.ax{stroke:var(--ink-2,#6a6e72);stroke-width:1;fill:none}
.gr{stroke:var(--rule,#e2e5e7);stroke-width:1;fill:none}
.rf{stroke:var(--ink-2,#6a6e72);stroke-width:1;stroke-dasharray:5 4;fill:none}
.cell{fill:var(--panel,#f5f6f6);stroke:var(--ink-3,#9a9ea2);stroke-width:1}
.bar{stroke:var(--ink,#2f3133);stroke-width:2.25;fill:none}
.face{stroke:var(--ink,#2f3133);stroke-width:1.25;stroke-dasharray:4 3;fill:none}
.box{fill:var(--ground,#ffffff);stroke:var(--ink,#2f3133);stroke-width:1.25}
.box2{fill:var(--field,#eef0f1);stroke:var(--ink-3,#9a9ea2);stroke-width:1}
.ar{stroke:var(--ink,#2f3133);stroke-width:1.25;fill:none}
.ar2{stroke:var(--ink-2,#6a6e72);stroke-width:1;fill:none;stroke-dasharray:4 3}
.ah{fill:var(--ink,#2f3133)}
.t{fill:var(--ink,#2f3133);font:13px var(--font-serif,Georgia,serif)}
.ti{fill:var(--ink,#2f3133);font:italic 13px var(--font-serif,Georgia,serif)}
.s{fill:var(--ink-2,#6a6e72);font:11px var(--font-mono,monospace)}
.sb{fill:var(--ink,#2f3133);font:600 11px var(--font-mono,monospace)}
.c1{stroke:var(--ink,#2f3133);stroke-width:1.75;fill:none}
.c2{stroke:var(--ink-2,#6a6e72);stroke-width:1.5;fill:none}
.c3{stroke:var(--ink,#2f3133);stroke-width:1.75;fill:none;stroke-dasharray:2 3}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="cell" x="90" y="192" width="180" height="70"/>
<line class="bar" x1="90" y1="192" x2="270" y2="192"/>
<text x="180.0" y="184" text-anchor="middle" class="t"><tspan class="ti">v̄</tspan><tspan font-size="10" dy="4">j−1</tspan><tspan font-size="10" dy="-10">n</tspan></text>
<text x="180.0" y="296" text-anchor="middle" class="s">cell j−1</text>
<rect class="cell" x="270" y="158" width="180" height="104"/>
<line class="bar" x1="270" y1="158" x2="450" y2="158"/>
<text x="360.0" y="150" text-anchor="middle" class="t"><tspan class="ti">v̄</tspan><tspan font-size="10" dy="4">j</tspan><tspan font-size="10" dy="-10">n</tspan></text>
<text x="360.0" y="296" text-anchor="middle" class="s">cell j</text>
<rect class="cell" x="450" y="204" width="180" height="58"/>
<line class="bar" x1="450" y1="204" x2="630" y2="204"/>
<text x="540.0" y="196" text-anchor="middle" class="t"><tspan class="ti">v̄</tspan><tspan font-size="10" dy="4">j+1</tspan><tspan font-size="10" dy="-10">n</tspan></text>
<text x="540.0" y="296" text-anchor="middle" class="s">cell j+1</text>
<line class="ax" x1="40" y1="262" x2="680" y2="262"/>
<line class="ax" x1="90" y1="262" x2="90" y2="267"/>
<text x="90" y="280" text-anchor="middle" class="s"><tspan class="ti">x</tspan><tspan font-size="9" dy="3">j−3/2</tspan></text>
<line class="ax" x1="270" y1="262" x2="270" y2="267"/>
<text x="270" y="280" text-anchor="middle" class="s"><tspan class="ti">x</tspan><tspan font-size="9" dy="3">j−1/2</tspan></text>
<line class="ax" x1="450" y1="262" x2="450" y2="267"/>
<text x="450" y="280" text-anchor="middle" class="s"><tspan class="ti">x</tspan><tspan font-size="9" dy="3">j+1/2</tspan></text>
<line class="ax" x1="630" y1="262" x2="630" y2="267"/>
<text x="630" y="280" text-anchor="middle" class="s"><tspan class="ti">x</tspan><tspan font-size="9" dy="3">j+3/2</tspan></text>
<line class="face" x1="270" y1="262" x2="270" y2="92"/>
<rect class="box" x="208" y="56" width="124" height="34" rx="3"/>
<text x="270" y="78" text-anchor="middle" class="t"><tspan class="ti">a v̄</tspan><tspan font-size="10" dy="4">j−1</tspan><tspan dy="-4"> </tspan></text>
<line class="face" x1="450" y1="262" x2="450" y2="92"/>
<rect class="box" x="388" y="56" width="124" height="34" rx="3"/>
<text x="450" y="78" text-anchor="middle" class="t"><tspan class="ti">a v̄</tspan><tspan font-size="10" dy="4">j</tspan><tspan dy="-4"> </tspan></text>
<path class="ar2" d="M270,50 L270,40 L450,40 L450,50"/>
<text x="360" y="33" text-anchor="middle" class="s">designed: first-order upwind flux for u<tspan font-size="9" dy="3">t</tspan><tspan dy="-3"> + a u</tspan><tspan font-size="9" dy="3">x</tspan><tspan dy="-3"> = 0, a &gt; 0</tspan></text>
<line class="ar" x1="236" y1="128" x2="304" y2="128" marker-end="url(#ah)"/>
<line class="ar" x1="416" y1="128" x2="484" y2="128" marker-end="url(#ah)"/>
<text x="236" y="120" text-anchor="end" class="sb">−</text>
<text x="306" y="120" text-anchor="start" class="sb">+</text>
<text x="416" y="120" text-anchor="end" class="sb">−</text>
<text x="486" y="120" text-anchor="start" class="sb">+</text>
<text x="490" y="150" text-anchor="start" class="s">what leaves cell j</text>
<text x="490" y="164" text-anchor="start" class="s">enters cell j+1</text>
<text x="360" y="330" text-anchor="middle" class="s">each face value is subtracted from the cell on its left and added to the cell on its right: the sum telescopes</text>
</svg>
