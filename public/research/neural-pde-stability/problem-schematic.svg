<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" width="720" height="282" role="img" aria-label="Schematic, not data: two networks trained identically up to the random seed reach training losses that cannot be told apart. Under long rollouts one tracks the reference solution and the other develops oscillations that grow. The question is whether this can be told from the trained network alone, before the simulation.">
<style>
.ax{stroke:var(--ink-2,#6a6e72);stroke-width:1;fill:none}
.gr{stroke:var(--rule,#e2e5e7);stroke-width:1;fill:none}
.rf{stroke:var(--ink-2,#6a6e72);stroke-width:1;stroke-dasharray:5 4;fill:none}
.cell{fill:var(--panel,#f5f6f6);stroke:var(--ink-3,#9a9ea2);stroke-width:1}
.bar{stroke:var(--ink,#2f3133);stroke-width:2.25;fill:none}
.face{stroke:var(--ink,#2f3133);stroke-width:1.25;stroke-dasharray:4 3;fill:none}
.box{fill:var(--ground,#ffffff);stroke:var(--ink,#2f3133);stroke-width:1.25}
.box2{fill:var(--field,#eef0f1);stroke:var(--ink-3,#9a9ea2);stroke-width:1}
.ar{stroke:var(--ink,#2f3133);stroke-width:1.25;fill:none}
.ar2{stroke:var(--ink-2,#6a6e72);stroke-width:1;fill:none;stroke-dasharray:4 3}
.ah{fill:var(--ink,#2f3133)}
.t{fill:var(--ink,#2f3133);font:13px var(--font-serif,Georgia,serif)}
.ti{fill:var(--ink,#2f3133);font:italic 13px var(--font-serif,Georgia,serif)}
.s{fill:var(--ink-2,#6a6e72);font:11px var(--font-mono,monospace)}
.sb{fill:var(--ink,#2f3133);font:600 11px var(--font-mono,monospace)}
.c1{stroke:var(--ink,#2f3133);stroke-width:1.75;fill:none}
.c2{stroke:var(--ink-2,#6a6e72);stroke-width:1.5;fill:none}
.c3{stroke:var(--ink,#2f3133);stroke-width:1.75;fill:none;stroke-dasharray:2 3}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>
<rect class="box" x="20" y="40" width="92" height="40" rx="3"/>
<text x="66.0" y="64.0" text-anchor="middle" class="t">seed A</text>
<rect class="box" x="20" y="120" width="92" height="40" rx="3"/>
<text x="66.0" y="144.0" text-anchor="middle" class="t">seed B</text>
<rect class="box2" x="150" y="70" width="150" height="60" rx="3"/>
<text x="225.0" y="88.0" text-anchor="middle" class="t">training: one-step</text>
<text x="225.0" y="104.0" text-anchor="middle" class="t">error on a short</text>
<text x="225.0" y="120.0" text-anchor="middle" class="t">reference trajectory</text>
<line class="ar" x1="112" y1="60" x2="148" y2="88" marker-end="url(#ah)"/>
<line class="ar" x1="112" y1="140" x2="148" y2="112" marker-end="url(#ah)"/>
<rect class="box" x="338" y="40" width="120" height="40" rx="3"/>
<text x="398.0" y="64.0" text-anchor="middle" class="t">network A</text>
<rect class="box" x="338" y="120" width="120" height="40" rx="3"/>
<text x="398.0" y="144.0" text-anchor="middle" class="t">network B</text>
<line class="ar" x1="300" y1="92" x2="336" y2="62" marker-end="url(#ah)"/>
<line class="ar" x1="300" y1="108" x2="336" y2="138" marker-end="url(#ah)"/>
<rect class="ar2" x="328" y="30" width="140" height="140" rx="6"/>
<text x="398" y="97" text-anchor="middle" class="s">losses</text>
<text x="398" y="110" text-anchor="middle" class="s">indistinguishable</text>
<rect class="box" x="500" y="40" width="200" height="40" rx="3"/>
<text x="600.0" y="64.0" text-anchor="middle" class="t">rollout tracks the reference</text>
<rect class="box" x="500" y="120" width="200" height="40" rx="3"/>
<text x="600.0" y="136.0" text-anchor="middle" class="t">oscillations grow until</text>
<text x="600.0" y="152.0" text-anchor="middle" class="t">the output is worthless</text>
<line class="ar" x1="458" y1="60" x2="498" y2="60" marker-end="url(#ah)"/>
<line class="ar" x1="458" y1="140" x2="498" y2="140" marker-end="url(#ah)"/>
<text x="600" y="22" text-anchor="middle" class="s">under long rollouts</text>
<rect class="box2" x="170" y="214" width="380" height="52" rx="3"/>
<text x="360.0" y="236.0" text-anchor="middle" class="t">can you tell which, from the trained network alone,</text>
<text x="360.0" y="252.0" text-anchor="middle" class="t">before committing to the simulation?</text>
<path class="ar2" d="M398,170 L398,212" marker-end="url(#ah)"/>
</svg>
